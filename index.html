<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    
    <marquee behavior="scroll" direction="right" scrollamount="20">hello world</marquee>
    <marquee behavior="slide" direction="right" scrollamount="20">hello world</marquee>
    <marquee behavior="alternate" loop="3" direction="right" scrollamount="60">hello world</marquee>
    <marquee behavior="" direction="left">hello world</marquee>
    <marquee behavior="" direction="up" height="100px" >hello world</marquee>
    <marquee behavior="" direction="down"  height="100px">hello world</marquee>


</body>
</html>
